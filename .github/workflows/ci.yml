name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Grant git access to the private model-registry dependency
        shell: bash
        run: git config --global url."https://x-access-token:${MODEL_REGISTRY_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          MODEL_REGISTRY_READ_TOKEN: ${{ secrets.MODEL_REGISTRY_READ_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Grant git access to the private model-registry dependency
        shell: bash
        run: git config --global url."https://x-access-token:${MODEL_REGISTRY_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          MODEL_REGISTRY_READ_TOKEN: ${{ secrets.MODEL_REGISTRY_READ_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation

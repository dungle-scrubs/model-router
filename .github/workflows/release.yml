name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Grant git access to the private model-registry dependency
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$MODEL_REGISTRY_DEPLOY_KEY" > "$HOME/.ssh/model_registry"
          chmod 600 "$HOME/.ssh/model_registry"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts"
          git config --global core.sshCommand "ssh -i '$HOME/.ssh/model_registry' -o IdentitiesOnly=yes"
          git config --global url."git@github.com:dungle-scrubs/model-registry".insteadOf "https://github.com/dungle-scrubs/model-registry"
        env:
          MODEL_REGISTRY_DEPLOY_KEY: ${{ secrets.MODEL_REGISTRY_DEPLOY_KEY }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Ensure npm CLI is at least 11.5.1
        shell: bash
        run: |
          set -euo pipefail
          required="11.5.1"
          current="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n1)" = "$required" ]; then
            echo "npm $current satisfies >= $required"
          else
            echo "npm $current is older than $required; upgrading to latest 11.x"
            npm install -g "npm@^$required"
            echo "npm now $(npm --version)"
          fi
      - run: npm publish --provenance --access public